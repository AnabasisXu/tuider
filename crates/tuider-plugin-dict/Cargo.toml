[package]
name = "tuider-plugin-dict"
version = "0.1.0"
edition = "2024"
description = "Tuider MDX dictionary plugin (.so)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
name = "tuider_dict"

[dependencies]
tuider-plugin-api = { path = "../tuider-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
mdx-tui-mdict = { path = "../../../mdx-tui-mdict", version = "0.1.4" }
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1"
