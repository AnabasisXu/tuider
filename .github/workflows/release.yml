name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-slim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tuider
    steps:
      - uses: actions/checkout@v4
        with:
          path: tuider
      # dict crate path-dep: ../../../mdx-tui-mdict → sibling of tuider/
      - uses: actions/checkout@v4
        with:
          repository: AnabasisXu/mdx-tui-mdict
          path: mdx-tui-mdict
      - uses: dtolnay/rust-toolchain@stable
      - name: package slim
        run: bash scripts/package-slim.sh dist
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuider-linux-slim
          path: tuider/dist/*.tar.gz
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tuider/dist/*.tar.gz
          generate_release_notes: true
          body: |
            Linux **slim** tarball: `tuider` + `libtuider_{url,hn,epub}.so`.
            **No** `libtuider_dict.so` (AGPL / self-build only).
            See `INSTALL.txt` inside the archive and `CHANGELOG.md`.
