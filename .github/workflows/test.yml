name: test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tuider
    steps:
      - uses: actions/checkout@v4
        with:
          path: tuider
      # dict crate path-dep: ../../../mdx-tui-mdict → sibling of tuider/
      - uses: actions/checkout@v4
        with:
          repository: AnabasisXu/mdx-tui-mdict
          path: mdx-tui-mdict
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --workspace
      - name: smoke core
        run: bash scripts/smoke-core.sh
      - name: smoke epub
        run: bash scripts/smoke-epub.sh
